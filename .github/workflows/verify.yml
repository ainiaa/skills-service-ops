name: verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.lock
      - run: python scripts/setup.py --check-dependencies --capability all
      - run: python scripts/test_service_ops.py
      - run: python -m py_compile scripts/*.py
